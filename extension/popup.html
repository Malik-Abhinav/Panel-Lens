<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PanelLens</title>
    <style>
      body { width: 260px; margin: 0; padding: 16px; color: #171717; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; }
      h1 { margin: 0 0 10px; font-size: 16px; }
      button { width: 100%; padding: 8px 10px; border: 0; border-radius: 7px; background: #3157d5; color: white; font: inherit; font-weight: 600; cursor: pointer; }
      label { display: block; margin-top: 12px; font-weight: 600; }
      select { width: 100%; margin-top: 5px; padding: 6px; }
      textarea { box-sizing: border-box; width: 100%; min-height: 58px; margin-top: 5px; resize: vertical; }
      small { display: block; margin-top: 3px; color: #777; }
      #status { margin: 10px 0 0; color: #555; white-space: pre-line; }
    </style>
  </head>
  <body>
    <h1>PanelLens spike</h1>
    <button id="toggle" type="button">Start on this page</button>
    <label for="processing-mode">Processing mode</label>
    <select id="processing-mode">
      <option value="eco">Eco — 2 ahead, single requests</option>
      <option value="balanced" selected>Balanced — 4 ahead, batches of 3</option>
      <option value="full">Full — loaded chapter, batches of 3</option>
    </select>
    <small>Full mode continues through every detected image and uses more power.</small>
    <label for="glossary">Name and gender glossary</label>
    <textarea id="glossary" placeholder="베리엘=Belial (male)&#10;엘리스=Ellis"></textarea>
    <small>One Korean=English mapping per line. Used as reference only.</small>
    <p id="status">Checking local engine…</p>
    <script src="popup.js"></script>
  </body>
</html>
