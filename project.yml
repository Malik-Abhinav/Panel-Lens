name: PanelLens

options:
  bundleIdPrefix: com.panellens
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  PanelLens:
    type: application
    platform: macOS
    sources:
      - path: PanelLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panellens.app
        PRODUCT_NAME: PanelLens
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: >-
          PanelLens captures the browser window you select so it can recognize
          and translate visible manhwa or manhua text locally.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: DK4MKJ7QP9
    entitlements:
      path: PanelLens/PanelLens.entitlements
